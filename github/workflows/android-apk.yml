name: Build LifeMate AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "remix-lifemate-ai.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q remix-lifemate-ai.zip -d android-project
          test -f android-project/app/build.gradle.kts

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeMate-AI-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
